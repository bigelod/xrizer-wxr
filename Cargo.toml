[package]
name = "xrizer-wxr"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "OpenVR → WinlatorXR XrAPI bridge (no OpenXR)"
repository = "https://github.com/bigelod/xrizer-wxr"

[lib]
crate-type = ["cdylib"]

[workspace]
members = ["openvr", "macros", "fakexr"]

[workspace.dependencies]
derive_more = { version = "2.0.1", features = ["deref", "from", "try_into"] }
glam = "0.30.4"
log = "0.4.22"
slotmap = "1.0.7"
tracy-client = { version = "0.17.6", features = ["only-localhost"] }
ash = "0.38"
paste = "1.0.15"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.lints.clippy]
all = "deny"

[features]
default = []
tracing = ["dep:tracy-client"]

[dependencies]
log = { workspace = true }
glam = { workspace = true }
env_logger = "0.11.5"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.5"
crossbeam-channel = "0.5"
parking_lot = "0.12"
openvr = { path = "openvr" }
macros = { path = "macros" }
paste = "1.0.15"
libc = "0.2"
tracy-client = { workspace = true, optional = true }
ash = { workspace = true }
slotmap = { workspace = true }
libloading = "0.8.5"
lz4_flex = "0.11"
obj = "0.10.2"
time = { version = "0.3", features = ["macros", "formatting", "parsing"] }
derive_more = { workspace = true }
seq-macro = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }